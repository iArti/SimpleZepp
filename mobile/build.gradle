plugins {
    id('com.android.application')
    id('kotlin-android')
    id('kotlin-kapt')
    // Helper code (wearsettings) uses hidden APIs through Refine
    id('dev.rikka.tools.refine') version libs.versions.refine.version
}

android {
    compileSdk = libs.versions.compileSdkVersion.get().toInteger()

    defaultConfig {
        // Zepp OS fork: own package so it can live next to the official app
        applicationId "dev.iarti.simplewear"

        testApplicationId "com.thewizrd.simpleweather.test"
        // Specifies the fully-qualified class name of the test instrumentation runner.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The following argument makes the Android Test Orchestrator run its
        // "pm clear" command after each test invocation. This command ensures
        // that the app's state is completely cleared between tests.
        testInstrumentationRunnerArguments clearPackageData: 'true'

        minSdkVersion libs.versions.minSdkVersion.get().toInteger()
        // Zepp OS fork: sideloaded for personal use. targetSdk 28 keeps the legacy toggle APIs
        // (Wi-Fi, Bluetooth, ...) that SimpleWear otherwise delegates to the separate Helper app
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        // NOTE: Version Code Format [TargetSDK, Version Name, Build Number, Variant Code (Android: 0, WearOS: 1)]
        // NOTE: update SUPPORTED_VERSION_CODE if needed
        versionCode 361917020
        versionName "0.1.0" // SimpleZepp release (versionCode kept from upstream so installs update)

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            // Built-in Helper: the wearsettings action code, synced by syncHelperSources
            java.srcDir layout.buildDirectory.dir('generated/helper-src')
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }
    namespace 'com.thewizrd.simplewear'
}

dependencies {
    implementation project(":shared_resources")
    implementation project(":common")

    coreLibraryDesugaring libs.desugar.jdk.libs

    // Unit Testing
    androidTestImplementation libs.test.core

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation libs.test.runner
    androidTestImplementation libs.test.rules

    // Assertions
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.truth
    androidTestImplementation libs.google.truth

    // Kotlin
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.play.services

    implementation libs.core.ktx
    implementation libs.core.splashscreen
    implementation libs.preference.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation libs.work.runtime.ktx

    implementation libs.play.services.wearable
    implementation libs.app.update.ktx


    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.recyclerview.selection
    implementation libs.media

    implementation libs.material

    implementation libs.timber
    implementation libs.gson
    implementation libs.dexmaker
    // came transitively with Firebase upstream
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"

    // Built-in Helper (wearsettings): root, Shizuku, hidden APIs
    compileOnly project(':hidden-api')
    implementation libs.libsu.core
    implementation libs.shizuki.api
    implementation libs.shizuki.provider
    implementation libs.refine.runtime
    implementation libs.hiddenapibypass
}

apply from: rootProject.file("signing.gradle")

// Built-in Helper: reuse wearsettings' action implementations as-is (without its UI and service)
def syncHelperSources = tasks.register('syncHelperSources', Sync) {
    from('../wearsettings/src/main/java') {
        include 'com/thewizrd/wearsettings/actions/**'
        include 'com/thewizrd/wearsettings/root/**'
        include 'com/thewizrd/wearsettings/shizuku/**'
        include 'com/thewizrd/wearsettings/Settings.kt'
    }
    into layout.buildDirectory.dir('generated/helper-src')
}
preBuild.dependsOn syncHelperSources
